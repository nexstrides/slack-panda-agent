services:
  slack-bot:
    build:
      context: .
      dockerfile: services/slack-bot/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PYTHON_API_URL=http://python-api:8000
      - SLACK_BOT_PORT=3000
    depends_on:
      - python-api
    networks:
      - pandaagent-network

  python-api:
    build:
      context: services/python-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HISTORY_DB_PATH=/data/history.db
    volumes:
      - python-history:/data
    networks:
      - pandaagent-network

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - pandaagent-network

volumes:
  python-history:

networks:
  pandaagent-network:
    driver: bridge
